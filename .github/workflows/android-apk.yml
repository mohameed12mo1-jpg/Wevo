name: Build MicUp with Wevo Local Audio Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "ci/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-micup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout bridge repository
        uses: actions/checkout@v4

      - name: Checkout pinned MicUp source
        run: |
          git clone https://github.com/papergray/MicUp.git "$RUNNER_TEMP/MicUp"
          cd "$RUNNER_TEMP/MicUp"
          git checkout aacf0b087dfd77eb73c69633d305f1a94386d0d6

      - name: Apply isolated Wevo bridge patch
        run: |
          cp "$GITHUB_WORKSPACE/ci/patch_micup_bridge.py" "$RUNNER_TEMP/MicUp/patch_micup_bridge.py"
          cd "$RUNNER_TEMP/MicUp"
          python3 patch_micup_bridge.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android command line tools and SDK
        shell: bash
        run: |
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/cmdline-tools.zip"
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Generate wrapper and build debug APK
        working-directory: ${{ runner.temp }}/MicUp
        env:
          ANDROID_NDK_HOME: ${{ runner.temp }}/android-sdk/ndk/26.3.11579264
        run: |
          gradle wrapper --gradle-version 8.6 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK and print package metadata
        working-directory: ${{ runner.temp }}/MicUp
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK" | head -n 8

      - name: Upload patched MicUp APK
        uses: actions/upload-artifact@v4
        with:
          name: MicUp-Wevo-Bridge-Patched-Debug
          path: ${{ runner.temp }}/MicUp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
